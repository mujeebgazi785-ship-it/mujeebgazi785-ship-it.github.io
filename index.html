<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mujeeb Gazi Motivational - Hoslo Ki Udaan</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: #161b26;
            --border-color: #232d3f;
            --text-color: #d1d5db;
            --heading-color: #ffffff;
            --accent-gold: #ffc107;
            --accent-glow: rgba(255, 193, 7, 0.4);
            --gradient-card: linear-gradient(145deg, #18202e, #10141d);
        }

        [data-theme="light"] {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --text-color: #374151;
            --heading-color: #111827;
            --accent-gold: #d97706;
            --accent-glow: rgba(217, 119, 6, 0.2);
            --gradient-card: linear-gradient(145deg, #ffffff, #f9fafb);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px 10px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 10px 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .counter-badge {
            background: rgba(255, 193, 7, 0.1);
            color: var(--accent-gold);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 5px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* Highlighted Profile Section */
        .profile-card {
            background: var(--gradient-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background: var(--accent-glow);
            filter: blur(80px);
            border-radius: 50%;
            z-index: 0;
        }

        .profile-content {
            position: relative;
            z-index: 1;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid var(--accent-gold);
            object-fit: cover;
            object-position: center top;
            margin-bottom: 15px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .profile-title {
            font-size: 1.6rem;
            color: var(--heading-color);
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .profile-username {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .bio-text {
            font-size: 0.95rem;
            margin: 15px auto;
            max-width: 600px;
            background: rgba(255,255,255,0.03);
            padding: 12px 18px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-gold);
            text-align: center;
        }

        .links-list {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            list-style: none;
            font-size: 0.85rem;
            margin-top: 20px;
        }

        .links-list a {
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            transition: 0.2s;
        }

        .links-list a:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* Controls Area (Centered) */
        .controls-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: var(--text-color);
            margin: 0 auto 20px auto;
            outline: none;
            display: block;
            font-size: 0.95rem;
            text-align: center;
            transition: 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-gold);
            color: #000;
            font-weight: 600;
            border-color: var(--accent-gold);
        }

        /* Feed Cards */
        .story-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .story-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 193, 7, 0.3);
        }

        .story-title {
            color: var(--accent-gold);
            font-size: 1.15rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .story-text {
            font-size: 0.95rem;
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .story-moral {
            font-size: 0.85rem;
            color: #9ca3af;
            border-top: 1px dashed var(--border-color);
            padding-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="counter-badge">
            <i class="fa-solid fa-eye"></i> Visitors: <span id="visitor-count">1,248</span>
        </div>
        <div>
            <button class="action-btn" onclick="shareSite()"><i class="fa-solid fa-share-nodes"></i> Share</button>
            <button class="action-btn" id="theme-toggle" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>
    </div>

    <!-- Highlighted Profile -->
    <div class="profile-card">
        <div class="profile-content">
            <!-- First attempts profile.jpg, falls back to GitHub Avatar -->
            <img src="profile.jpg" onerror="this.onerror=null; this.src='https://github.com/mujeebgazi785-ship-it.png';" alt="Mujeeb Gazi" class="profile-img">
            
            <h2 class="profile-title">Mujeeb Gazi Motivational</h2>
            <p class="profile-username">@mujeebgazi785-ship-it</p>
            
            <div class="bio-text">
                ⭐ <strong>Hoslo Ki Udaan</strong> ⭐<br>
                Ye sirf ek website nahi, balki un logon ke jazbaton ki awaaz hai jo zindagi ki mushkilon se larte hue bhi apne sapnon ko zinda rakhte hain.
            </div>

            <ul class="links-list">
                <li><a href="mailto:mujeebgazi785@gmail.com"><i class="fa-regular fa-envelope" style="color: var(--accent-gold);"></i> Email</a></li>
                <li><a href="#" target="_blank"><i class="fa-brands fa-youtube" style="color: #ff0000;"></i> YouTube</a></li>
                <li><a href="#" target="_blank"><i class="fa-brands fa-facebook" style="color: #1877f2;"></i> Facebook</a></li>
            </ul>
        </div>
    </div>

    <!-- Controls Area (Centered) -->
    <div class="controls-area">
        <input type="text" id="searchInput" class="search-box" placeholder="Search stories, quotes, shayari..." onkeyup="filterCards()">

        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
            <button class="filter-btn" onclick="filterCategory('story', this)">📖 Stories</button>
            <button class="filter-btn" onclick="filterCategory('shayari', this)">✍️ Shayari</button>
            <button class="filter-btn" onclick="filterCategory('quotes', this)">💬 Quotes</button>
        </div>
    </div>

    <!-- Content Feed -->
    <div id="postsFeed"></div>
</div>

<script>
    const contentData = [
        // Top Shayari from Poster
        { 
            title: "इरादे और हालात", 
            text: "याद रखो...\nहालात चाहे कितने भी कठोर हों, इरादे झुकने नहीं चाहिए,\nजो इंसान खुद पर यकीन रखता है, उसके सपने रुकने नहीं चाहिए।", 
            moral: "— MUJEEBGAZI", 
            cat: "shayari" 
        },
        { 
            title: "खुद पर भरोसा", 
            text: "लोग क्या कहेंगे ये सोचोगे, तो मंज़िल दूर रह जाएगी,\nखुद पर भरोसा रखना, किस्मत भी एक दिन झुक जाएगी।", 
            moral: "— MUJEEBGAZI", 
            cat: "shayari" 
        },
        { title: "हौसला (Hausla)", text: "एक लड़का जो एक छोटे गाँव से था, सब कहते थे कि तू कुछ नहीं कर पाएगा। लेकिन उसने प्रयास जारी रखा और अपनी अलग पहचान बनाई।", moral: "Seekh: हौसला कभी मत छोड़ो।", cat: "story" },
        { title: "चींटी की सीख", text: "एक चींटी बार-बार गिरती थी, लेकिन प्रयास बंद नहीं किया और आखिरकार अपनी मंज़िल तक पहुँच गई।", moral: "Seekh: निरंतर प्रयास ही सफलता की कुंजी है।", cat: "story" },
        { title: "सपनों का जहाँ", text: "सपने वो नहीं जो हम सोते हुए देखते हैं,\nसपने वो हैं जो हमें सोने नहीं देते।", moral: "— Mujeeb Gazi Motivational", cat: "shayari" },
        { title: "Daily Quote", text: "अगर आप सूर्य की तरह चमकना चाहते हैं, तो पहले सूर्य की तरह जलना सीखें।", moral: "Daily Motivation", cat: "quotes" }
    ];

    let currentCategory = 'all';

    function renderFeed(data) {
        const feed = document.getElementById('postsFeed');
        feed.innerHTML = '';
        
        if(data.length === 0) {
            feed.innerHTML = '<p style="text-align:center; padding: 20px;">कोई रिजल्ट नहीं मिला...</p>';
            return;
        }

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'story-card';
            let icon = 'fa-book-open';
            if(item.cat === 'shayari') icon = 'fa-pen-nib';
            if(item.cat === 'quotes') icon = 'fa-quote-left';

            card.innerHTML = `
                <div class="story-title"><i class="fa-solid ${icon}"></i> ${item.title}</div>
                <div class="story-text">${item.text}</div>
                <div class="story-moral">${item.moral}</div>
            `;
            feed.appendChild(card);
        });
    }

    function filterCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterCards();
    }

    function filterCards() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = contentData.filter(item => {
            const matchesCat = (currentCategory === 'all' || item.cat === currentCategory);
            const matchesQuery = item.title.toLowerCase().includes(query) || item.text.toLowerCase().includes(query);
            return matchesCat && matchesQuery;
        });
        renderFeed(filtered);
    }

    function toggleTheme() {
        const body = document.documentElement;
        const themeBtn = document.getElementById('theme-toggle');
        if (body.getAttribute('data-theme') === 'light') {
            body.removeAttribute('data-theme');
            themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        } else {
            body.setAttribute('data-theme', 'light');
            themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        }
    }

    function shareSite() {
        if (navigator.share) {
            navigator.share({
                title: 'Mujeeb Gazi Motivational',
                url: window.location.href
            });
        } else {
            alert('Link copied: ' + window.location.href);
        }
    }

    function initVisitorCount() {
        let count = localStorage.getItem('visitorCount') || 1248;
        count = parseInt(count) + 1;
        localStorage.setItem('visitorCount', count);
        document.getElementById('visitor-count').innerText = count.toLocaleString();
    }

    window.onload = () => {
        renderFeed(contentData);
        initVisitorCount();
    };
</script>
</body>
</html>
