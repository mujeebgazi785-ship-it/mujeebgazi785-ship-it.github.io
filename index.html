<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mujeeb Gazi - Official Website</title>
    <style>
        /* पूरी वेबसाइट का बैकग्राउंड और थीम */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e0d02, #0d0601);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }

        .container {
            max-width: 500px;
            width: 90%;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin: 20px auto;
        }

        /* प्रोफाइल फोटो स्टाइल */
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffaa44;
            box-shadow: 0 0 20px rgba(255, 170, 68, 0.4);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            color: #ffaa44;
            margin: 10px 0 5px 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #ccaabb;
            margin-bottom: 25px;
        }

        /* मोटिवेशनल शायरी बॉक्स */
        .quote-box {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #ffddaa;
            margin: 15px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            padding: 0 10px;
        }

        .btn-next {
            background: #ffaa44;
            color: #1e0d02;
            border: none;
            padding: 10px 25px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(255, 170, 68, 0.3);
        }

        .btn-next:hover {
            background: #ffcc88;
            transform: scale(1.05);
        }

        /* सोशल मीडिया लिंक्स */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 30px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* बटन्स के रंग */
        .github { background-color: #24292e; }
        .instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .youtube { background-color: #ff0000; }
        .facebook { background-color: #1877f2; }

        /* नया जोड़ा गया बटन (Website Link) */
        .website-btn { background-color: #00b4d8; }

        .social-link:hover {
            transform: translateY(-4px);
            filter: brightness(1.2);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- आपकी प्रोफाइल फोटो (यह इमेज ऑटोमैटिक लोड होगी) -->
        <img src="profile.jpg">

        <!-- आपका नाम -->
        <h1>MUJEEB GAZI</h1>
        <div class="subtitle">Meri Pehli Website - Manzil ki Talash ⭐ Golden theme</div>

        <!-- शायरी बॉक्स -->
        <div class="quote-box" id="quote">
            याद रखो... हालात चाहे कितने भी कठोर हों, इरादे झुकने नहीं चाहिए।
        </div>
        
        <button class="btn-next" onclick="changeQuote()">अगली शायरी ➔</button>

        <!-- सोशल मीडिया और नए बटन्स -->
        <<div class="links-container">
    <a href="https://github.com/mujeebgazi785-ship-it" target="_blank" class="social-link github">GitHub</a>
    <a href="https://youtube.com/@mujeebgazimotivational" target="_blank" class="social-link youtube">YouTube</a>
    <a href="https://www.facebook.com/share/198G7Fo34P/" target="_blank" class="social-link facebook">Facebook</a>
    <a href="https://instagram.com" target="_blank" class="social-link instagram">Instagram</a>
    <a href="#" target="_blank" class="social-link website-btn">My Portfolio</a>
</div>
            <a href="#" target="_blank" class="social-link website-btn">➕ My Portfolio</a>
        </div>
    </div>

    <script>
        // फोटो इमेज से ली गई शायरी की लिस्ट
        const quotes = [
            "याद रखो... हालात चाहे कितने भी कठोर हों, इरादे झुकने नहीं चाहिए।",
            "जो इंसान खुद पर यकीन रखता है, उसके सपने रुकने नहीं चाहिए।",
            "लोग क्या कहेंगे ये सोचोगे, तो मंज़िल दूर रह जाएगी।",
            "खुद पर भरोसा रखना, किस्मत भी एक दिन झुक जाएगी।"
        ];

        function changeQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            document.getElementById("quote").innerText = quotes[randomIndex];
        }
    </script>

</body>
</html>
