    let currentCategory = 'all';
    let currentPage = 1;
    const itemsPerPage = 6; // HAR PAGE PAR 6 ITEMS
    let filteredData = [...contentData];

    function renderFeed() {
        const feed = document.getElementById('postsFeed');
        feed.innerHTML = '';

        const start = (currentPage - 1) * itemsPerPage;
        const pageItems = filteredData.slice(start, start + itemsPerPage);

        if (filteredData.length === 0) {
            feed.innerHTML = '<p style="text-align:center; padding: 20px;">कोई रिजल्ट नहीं मिला...</p>';
            document.getElementById('prevBtn').disabled = true;
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('pageIndicator').innerText = 'Page 0';
            return;
        }

        pageItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'story-card';
            
            let icon = 'fa-book-open';
            if (item.cat === 'quotes') icon = 'fa-quote-left';
            if (item.cat === 'islamic') icon = 'fa-kaaba';

            let imgHTML = item.image ? `<img src="${item.image}" alt="${item.title}" class="post-img">` : '';

            card.innerHTML = `
                ${imgHTML}
                <div class="story-title"><i class="fa-solid ${icon}"></i> ${item.title}</div>
                <div class="story-text">${item.text}</div>
                <div class="story-moral">${item.moral}</div>
            `;
            feed.appendChild(card);
        });

        const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
        document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${totalPages}`;
        document.getElementById('prevBtn').disabled = (currentPage === 1);
        document.getElementById('nextBtn').disabled = (currentPage === totalPages);
    }

    function changePage(direction) {
        currentPage += direction;
        renderFeed();
        window.scrollTo({ top: 350, behavior: 'smooth' });
    }

    function initVisitorCount() {
        let count = localStorage.getItem('visitorCount') || 1248;
        count = parseInt(count) + 1;
        localStorage.setItem('visitorCount', count);
        document.getElementById('visitor-count').innerText = count.toLocaleString();
